plugins { id 'com.android.application' }

android {
    namespace 'io.github.pavelsvistunoff.microminichat.probe'
    compileSdk 35
    sourceSets.main.assets.srcDir rootProject.file('third_party/webrtc')
    defaultConfig {
        applicationId 'io.github.pavelsvistunoff.microminichat.probe'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-probe'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.04'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
