plugins { id 'com.android.application' }

android {
    namespace 'io.github.pavelsvistunoff.microminichat'
    compileSdk 35
    bundle { language { enableSplit = false } }
    sourceSets.main.assets.srcDir rootProject.file('third_party/tor')
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('tor-native/jni')
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources.excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        resources.merges += ['META-INF/LICENSE.md', 'META-INF/LICENSE', 'META-INF/NOTICE.md']
    }
    defaultConfig {
        applicationId 'io.github.pavelsvistunoff.microminichat'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.1.0-tor-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            def path=System.getenv('MMC_RELEASE_STORE')
            if (path) {
                if (!System.getenv('MMC_RELEASE_PASSWORD')) throw new GradleException('Release signing password is not configured')
                storeFile rootProject.file(path)
                storePassword System.getenv('MMC_RELEASE_PASSWORD')
                keyAlias 'microminichat-release'
                keyPassword System.getenv('MMC_RELEASE_PASSWORD')
            }
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }
    buildTypes {
        release {
            // Keep qualified APK hashes stable across the source commit/tag; avoid stale precommit VCS attribution.
            vcsInfo.include = false
            if (System.getenv('MMC_RELEASE_STORE')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

configurations { torDistribution }
tasks.register('prepareTorNative') {
    def output = layout.buildDirectory.dir('tor-native')
    outputs.dir(output)
    inputs.files(configurations.torDistribution)
    doLast {
        def aar = configurations.torDistribution.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(aar.bytes).encodeHex().toString()
        if (digest != '28ff2bb6d4d42eabe57183dedd7a97fce77e8ce4b6f5af6fa03993b3ca054edd') {
            throw new GradleException('Tor distribution checksum mismatch')
        }
        copy { from zipTree(aar); include 'jni/**'; into output }
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareTorNative' }

dependencies {
    torDistribution('info.guardianproject:tor-android:0.4.9.14@aar') { transitive = false }
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.conscrypt:conscrypt-android:2.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
}
